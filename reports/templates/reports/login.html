{% extends "reports/base.html" %}
{% block title %}Kirish{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Tizimga kirish</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<div class="msg error">Login yoki parol noto'g'ri.</div>{% endif %}
    <label>Login
      <input type="text" name="username" autofocus autocomplete="username" required>
    </label>
    <label>Parol
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Kirish</button>
  </form>
</div>
{% endblock %}
